[project]
name = "primitive-db"
version = "0.1.0"
description = "Примитивная база данных с консольным интерфейсом"
readme = "README.md"
authors = [
    { name = "Stepanov Alexandr", email = "36171529+c3alex@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
database = "primitive_db.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
